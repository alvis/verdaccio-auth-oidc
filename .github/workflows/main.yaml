name: Compliance

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions:
  contents: read
jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm and Node LTS
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
      - name: Run test (unit)
        run: pnpm run test:coverage
      - name: Run test (e2e)
        run: pnpm run --if-present test:e2e
      - name: Run lint
        run: pnpm run lint
